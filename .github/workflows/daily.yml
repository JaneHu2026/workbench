name: daily-fetch

on:
  schedule:
    - cron: '0 0 * * *'   # 北京时间 08:00
    - cron: '0 6 * * *'   # 北京时间 14:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取新闻（央视/人民网/新华网）
        run: python news_fetch.py

      - name: 抓取学习视频（YouTube/抖音/小红书）
        run: python study_fetch.py

      - name: 提交数据更新
        run: |
          git config user.name "workbench-bot"
          git config user.email "workbench-bot@users.noreply.github.com"
          git add news.json study.json
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "每日数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
